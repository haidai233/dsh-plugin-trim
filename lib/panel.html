<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>会话裁剪 · dsh-plugin-trim</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --fg: #16181d; --fg-soft: #5b616b; --fg-mute: #8a9099;
    --card: #ffffff; --card-2: #f2f4f7; --line: #e3e6ea; --line-strong: #cfd4da;
    --accent: #1a7f37; --accent-soft: rgba(26,127,55,.10);
    --warn: #9a6700; --warn-soft: rgba(154,103,0,.10);
    --danger: #b42318; --danger-soft: rgba(180,35,24,.10);
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --fg: #e6edf3; --fg-soft: #a9b3bf; --fg-mute: #7d8794;
      --card: #161b22; --card-2: #1b2129; --line: #262c36; --line-strong: #333b47;
      --accent: #3fb950; --accent-soft: rgba(63,185,80,.14);
      --warn: #d29922; --warn-soft: rgba(210,153,34,.14);
      --danger: #f85149; --danger-soft: rgba(248,81,73,.14);
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  html[data-theme="dark"] {
    --bg: #0e1116; --fg: #e6edf3; --fg-soft: #a9b3bf; --fg-mute: #7d8794;
    --card: #161b22; --card-2: #1b2129; --line: #262c36; --line-strong: #333b47;
    --accent: #3fb950; --accent-soft: rgba(63,185,80,.14);
    --warn: #d29922; --warn-soft: rgba(210,153,34,.14);
    --danger: #f85149; --danger-soft: rgba(248,81,73,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  html[data-theme="light"] {
    --bg: #f6f7f9; --fg: #16181d; --fg-soft: #5b616b; --fg-mute: #8a9099;
    --card: #ffffff; --card-2: #f2f4f7; --line: #e3e6ea; --line-strong: #cfd4da;
    --accent: #1a7f37; --accent-soft: rgba(26,127,55,.10);
    --warn: #9a6700; --warn-soft: rgba(154,103,0,.10);
    --danger: #b42318; --danger-soft: rgba(180,35,24,.10);
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 20px 56px; background: var(--bg); color: var(--fg);
    font: 14px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 940px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 19px; letter-spacing: .2px; margin: 0; font-weight: 650; }
  .version { font-size: 12px; color: var(--fg-mute); }
  .grow { flex: 1; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  h2 { font-size: 14px; margin: 0; font-weight: 620; }
  .hint { font-size: 12px; color: var(--fg-mute); }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; flex-wrap: wrap; }
  .row + .row { border-top: 1px solid var(--line); }
  .k { flex: 0 0 96px; color: var(--fg-soft); font-size: 13px; }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; line-height: 1.7; padding: 0 8px;
    border-radius: 999px; border: 1px solid var(--line-strong); color: var(--fg-soft); background: transparent; white-space: nowrap; }
  .badge.ok { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, transparent); background: var(--accent-soft); }
  .badge.warn { color: var(--warn); border-color: color-mix(in oklab, var(--warn) 45%, transparent); background: var(--warn-soft); }
  .badge.off { color: var(--fg-mute); }
  .badge.core { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 40%, transparent); }
  button { font: inherit; font-size: 12.5px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line-strong);
    background: var(--card-2); color: var(--fg); cursor: pointer; transition: filter .12s ease; }
  button:hover:not(:disabled) { filter: brightness(1.07); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { border-color: color-mix(in oklab, var(--accent) 50%, transparent); background: var(--accent-soft); color: var(--accent); }
  button.danger { border-color: color-mix(in oklab, var(--danger) 45%, transparent); background: var(--danger-soft); color: var(--danger); }
  select, input[type="search"] { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line-strong); background: var(--card-2); color: var(--fg); }
  select { min-width: 130px; }
  input[type="search"] { min-width: 220px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 2px 12px; }
  label.tool { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 8px; border-radius: 7px; cursor: pointer; }
  label.tool:hover { background: var(--card-2); }
  label.tool input { accent-color: var(--accent); width: 14px; height: 14px; }
  label.tool.cut span { color: var(--fg-mute); text-decoration: line-through; }
  .list .row { padding: 7px 0; }
  .list .row.hot { background: var(--warn-soft); border-radius: 6px; padding-left: 8px; padding-right: 8px; }
  .empty { color: var(--fg-mute); font-size: 13px; padding: 6px 0; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: min(780px, calc(100vw - 40px));
    background: var(--card); border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 14px; font-size: 13px;
    box-shadow: var(--shadow); display: none; }
  #toast.show { display: block; }
  #toast.bad { border-color: color-mix(in oklab, var(--danger) 55%, transparent); color: var(--danger); }
  #toast.good { border-color: color-mix(in oklab, var(--accent) 45%, transparent); color: var(--accent); }
  .theme-btn { font-size: 12px; padding: 3px 9px; }
  .scroll { max-height: 420px; overflow: auto; margin-top: 4px; }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }
  .pager { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .page { font-size: 12.5px; color: var(--fg-soft); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>会话裁剪</h1>
    <span class="version">dsh-plugin-trim 0.2.0</span>
    <span class="grow"></span>
    <button class="theme-btn" id="theme">主题：跟随系统</button>
  </header>

  <section class="card">
    <div class="card-head">
      <h2>会话</h2>
      <span class="hint">每个会话自己一个档位，互不影响</span>
      <span class="grow"></span>
      <button id="btnApplyAll">全部按档位重装</button>
      <button id="btnRestoreAll">全部放开</button>
    </div>
    <div id="agents" class="list"><span class="empty">读取中…</span></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>档位定义 · 工具名单</h2>
      <span class="hint">一个档位就是一份工具白名单：勾上的工具在套用它的会话里可见，没勾的会被裁掉</span>
    </div>
    <div class="card-head" style="margin-bottom:6px">
      <select id="profilePick"></select>
      <span class="hint" id="profileSummary"></span>
      <span class="grow"></span>
      <button class="primary" id="btnSaveProfile">保存这份工具名单</button>
      <button class="danger" id="btnDeleteProfile">删除档位</button>
    </div>
    <div class="row" style="border-top:none;padding-top:0">
      <input type="search" id="newProfile" placeholder="新档位名，例如 coding / chat" style="min-width:200px" />
      <button id="btnCreateProfile">新建档位</button>
      <span class="hint">新档位是一份空白工具名单：勾完点「保存这份工具名单」</span>
    </div>
    <div id="profileTools" class="grid"><span class="empty">选一个档位</span></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>本地 provider</h2>
      <span class="hint">决定哪些会话算「本地」→ 自动套 local 档</span>
      <span class="grow"></span>
      <select id="provselect"></select>
      <button class="primary" id="btnSaveProvider">保存</button>
    </div>
    <div class="row" style="border-top:none;padding-top:0">
      <span class="hint" id="provhint">—</span>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>插件（profile 级）</h2>
      <span class="hint">物理启停，影响这个 profile 下的全部会话</span>
      <span class="grow"></span>
      <button class="danger" id="btnApplyPlugins">关掉清单</button>
      <button class="primary" id="btnRestorePlugins">开回清单</button>
    </div>
    <div class="row" style="border-top:none;padding-top:0">
      <input type="search" id="plugsearch" placeholder="搜索 entryId 或包名…" />
      <label class="hint" style="display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="onlybad" /> 只看已停用
      </label>
      <span class="grow"></span>
      <span class="hint" id="plugfiltercount"></span>
    </div>
    <div id="allplugins" class="list scroll"><span class="empty">读取中…</span></div>
    <div class="pager">
      <button id="pgPrev">‹ 上一页</button>
      <span class="page" id="pgInfo">—</span>
      <button id="pgNext">下一页 ›</button>
      <span class="grow"></span>
      <span class="hint">每页 20 条</span>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2>最近动作</h2></div>
    <div id="action" class="empty">—</div>
  </section>
</div>
<div id="toast"></div>

<script>
const API = '/api/plugin-trim'
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const CORE = /^@deepseek-ai\/dsh-(base|llm|session|agent|tools|subprocess|storage|webserver|api-|host-|client-|typert|settings|credentials|sandbox|approval|permission|shell-env|jobs)/
let busy = false
let last = null
let page = 1
const PAGE = 20

const THEMES = ['auto', 'light', 'dark']
const THEME_LABEL = { auto: '跟随系统', light: '浅色', dark: '深色' }
let theme = localStorage.getItem('plugin-trim-theme') || 'auto'
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme')
  else document.documentElement.setAttribute('data-theme', theme)
  $('theme').textContent = '主题：' + THEME_LABEL[theme]
}
$('theme').onclick = () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]
  localStorage.setItem('plugin-trim-theme', theme)
  applyTheme()
}
applyTheme()

async function call(name, body) {
  const r = await fetch(API + '/' + name, {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}),
  })
  const p = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(p.error || 'HTTP ' + r.status)
  if (p.ok === false) throw new Error(p.error || '操作被拒绝')
  return p
}

let toastTimer = null
function toast(text, tone) {
  const el = $('toast')
  el.textContent = text
  el.className = 'show ' + (tone || 'good')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { el.className = '' }, 6000)
}

function renderAgents() {
  const agents = (last && last.agents) || []
  const profiles = (last && last.profiles) || []
  if (agents.length === 0) {
    $('agents').innerHTML = '<span class="empty">没有活动会话</span>'
    return
  }
  $('agents').innerHTML = agents.map((a) => {
    const opts = profiles.map((p) =>
      '<option value="' + esc(p.id) + '"' + (p.id === a.profile ? ' selected' : '') + '>' + esc(p.id) + '（' + p.count + '）</option>').join('')
    return '<div class="row">' +
      '<span class="badge ' + (a.local ? 'warn' : 'off') + '">' + (a.local ? '本地' : '云端') + '</span>' +
      '<span class="mono" title="' + esc(a.id) + '">' + esc(a.id.slice(0, 18)) + '…</span>' +
      '<span class="hint">' + esc(a.provider || '?') + '</span>' +
      '<span class="grow"></span>' +
      '<span class="mono">' + a.tools + ' 工具' + (a.restricted ? ' · 已裁 ' + a.kept : ' · 未裁') + '</span>' +
      '<span class="hint">工具档位</span>' +
      '<select data-agent="' + esc(a.id) + '">' + opts + '</select>' +
      '<button data-auto="' + esc(a.id) + '"' + (a.explicit ? '' : ' disabled') + '>跟随 provider</button>' +
      '</div>'
  }).join('')
  $('agents').querySelectorAll('select[data-agent]').forEach((sel) => {
    sel.onchange = () => act('换档 ' + sel.dataset.agent.slice(0, 8), () => call('setProfile', { agent: sel.dataset.agent, profile: sel.value }))
  })
  $('agents').querySelectorAll('button[data-auto]').forEach((btn) => {
    btn.onclick = () => act('回到自动套档', () => call('autoProfile', { agent: btn.dataset.auto }))
  })
}

function renderProfileEditor() {
  const profiles = (last && last.profiles) || []
  const names = (last && last.visibleNames) || []
  const pick = $('profilePick')
  const keepPick = pick.value
  pick.innerHTML = profiles.map((p) => '<option value="' + esc(p.id) + '">' + esc(p.id) + '（' + p.count + '）</option>').join('')
  // 默认落在第一个「能编辑」的档位上，别一上来就停在 full（それは表示が説明文だけになる）
  const editable = profiles.filter((p) => p.id !== 'full')
  if (keepPick && profiles.some((p) => p.id === keepPick)) pick.value = keepPick
  else if (editable.length > 0) pick.value = (editable.find((p) => p.id === 'local') || editable[0]).id
  const id = pick.value
  const def = profiles.find((p) => p.id === id)
  const del = $('btnDeleteProfile')
  if (del) {
    del.disabled = !(def && def.deletable)
    del.title = def && def.deletable ? '删除这个档位' : '内置档位不能删'
  }
  const used = ((last && last.agents) || []).filter((a) => a.profile === id).length
  if ($('profileSummary')) {
    $('profileSummary').textContent = def === undefined
      ? ''
      : id === 'full'
        ? '不限工具 · ' + used + ' 个会话在用'
        : def.count + ' 个工具 · ' + used + ' 个会话在用'
  }
  if (!def) {
    $('profileTools').innerHTML = '<span class="empty">选一个档位</span>'
    return
  }
  if (id === 'full') {
    $('profileTools').innerHTML = '<span class="empty">full 档不做任何裁剪，全部工具都可见；要裁剪工具请选 local，或用下面「新建档位」自己建一份名单</span>'
    return
  }
  const set = new Set(def.tools || [])
  $('profileTools').innerHTML = names.length === 0
    ? '<span class="empty">还没有会话，看不到工具名；先随便开一个会话再来勾</span>'
    : names.map((n) =>
        '<label class="tool' + (set.has(n) ? '' : ' cut') + '"><input type="checkbox" data-pname="' + esc(n) + '"' +
        (set.has(n) ? ' checked' : '') + ' /><span class="mono">' + esc(n) + '</span></label>').join('')
  $('profileTools').querySelectorAll('input[data-pname]').forEach((box) => {
    box.onchange = () => box.closest('label').classList.toggle('cut', !box.checked)
  })
}

function renderProvider() {
  const providers = (last && last.providers) || []
  const chosen = (last && last.localProvider) || ''
  const sel = $('provselect')
  sel.innerHTML = '<option value="">自动识别（按 baseURL / 名字）</option>' + providers.map((p) =>
    '<option value="' + esc(p.id) + '">' + esc(p.id) + (p.local ? '（本地）' : '（云端）') + (p.baseURL ? ' — ' + esc(p.baseURL) : '') + '</option>').join('')
  sel.value = chosen && providers.some((p) => p.id === chosen) ? chosen : ''
  $('provhint').textContent = chosen ? '已锁定：' + chosen : '当前：自动识别'
}

function renderPlugins() {
  if (!last) return
  const q = $('plugsearch').value.trim().toLowerCase()
  const onlyBad = $('onlybad').checked
  let rows = (last.candidates || []).slice()
  if (q) rows = rows.filter((r) => (r.entryId + ' ' + r.moduleName + ' ' + r.short).toLowerCase().includes(q))
  if (onlyBad) rows = rows.filter((r) => !r.enabled)
  rows.sort((a, b) => {
    if (a.inList !== b.inList) return a.inList ? -1 : 1
    if (a.enabled !== b.enabled) return a.enabled ? -1 : 1
    return (a.short || a.entryId).localeCompare(b.short || b.entryId)
  })
  const pages = Math.max(1, Math.ceil(rows.length / PAGE))
  if (page > pages) page = pages
  const slice = rows.slice((page - 1) * PAGE, page * PAGE)
  $('plugfiltercount').textContent = '匹配 ' + rows.length
  $('pgInfo').textContent = '第 ' + page + ' / ' + pages + ' 页'
  $('pgPrev').disabled = page <= 1
  $('pgNext').disabled = page >= pages
  if (rows.length === 0) {
    $('allplugins').innerHTML = '<span class="empty">没有匹配的插件</span>'
    return
  }
  $('allplugins').innerHTML = slice.map((r) => {
    const core = CORE.test(r.moduleName)
    return '<div class="row' + (r.inList ? ' hot' : '') + '">' +
      '<span class="badge ' + (r.enabled ? 'ok' : 'off') + '">' + (r.enabled ? '开' : '关') + '</span>' +
      '<span class="mono">' + esc(r.short || r.entryId) + '</span>' +
      '<span class="hint">' + esc(r.moduleName) + '</span>' +
      (r.inList ? '<span class="badge warn">清单</span>' : '') +
      (core ? '<span class="badge core">核心</span>' : '') +
      '<span class="grow"></span>' +
      '<button data-entry="' + esc(r.entryId) + '" data-to="' + (r.enabled ? '0' : '1') + '" data-core="' + (core ? '1' : '0') + '">' +
      (r.enabled ? '停用' : '启用') + '</button></div>'
  }).join('')
  $('allplugins').querySelectorAll('button[data-entry]').forEach((btn) => {
    btn.onclick = () => {
      const want = btn.dataset.to === '1'
      if (btn.dataset.core === '1' && !want && !confirm('这是 DSH 核心组件。停掉可能让界面不可用，确定？')) return
      act((want ? '启用 ' : '停用 ') + btn.dataset.entry, () => call('set', { entryId: btn.dataset.entry, enabled: want }))
    }
  })
}

async function refresh() {
  const s = await call('status')
  last = s
  renderAgents()
  renderProfileEditor()
  renderProvider()
  renderPlugins()
  const a = s.lastAction || {}
  $('action').textContent = (a.text || '—') + (a.at ? ' · ' + new Date(a.at).toLocaleString() : '')
  $('action').className = a.text ? '' : 'empty'
}

function describe(r) {
  const parts = []
  if (r && r.plugins) {
    if (Array.isArray(r.plugins.done)) parts.push('插件 ' + r.plugins.done.length)
    if (Array.isArray(r.plugins.skipped) && r.plugins.skipped.length) parts.push('跳过 ' + r.plugins.skipped.length)
  }
  const rows = (r && (r.rows || [])) || []
  if (Array.isArray(rows) && rows.length) {
    const ok = rows.filter((x) => x.ok === true || x.off === true).length
    parts.push('会话 ' + ok + ' 个')
    const failed = rows.filter((x) => x.ok === false && x.why)
    if (failed.length) parts.push('失败 ' + failed.length + '（' + failed[0].why + '）')
  }
  if (r && r.result && r.result.ok === false) parts.push('失败：' + (r.result.why || ''))
  if (r && r.result && r.result.profile) parts.push('档位 ' + r.result.profile)
  return parts.join(' · ') || '完成'
}

async function act(label, fn) {
  if (busy) return
  busy = true
  document.querySelectorAll('button').forEach((b) => (b.disabled = true))
  try {
    const r = await fn()
    await refresh()
    toast(label + ' 完成 · ' + describe(r), 'good')
  } catch (e) {
    toast(label + ' 失败：' + String(e.message || e), 'bad')
    await refresh().catch(() => {})
  } finally {
    busy = false
    document.querySelectorAll('button').forEach((b) => {
      if (b.id === 'pgPrev' || b.id === 'pgNext') return
      b.disabled = false
    })
    renderPlugins()
  }
}

$('btnApplyAll').onclick = () => act('全部按档位重装', () => call('applyAll'))
$('btnRestoreAll').onclick = () => act('全部放开', () => call('restoreAll'))
$('btnApplyPlugins').onclick = () => act('关掉插件清单', () => call('applyPlugins'))
$('btnRestorePlugins').onclick = () => act('开回插件清单', () => call('restorePlugins'))
$('btnSaveProvider').onclick = () => act('设置本地 provider', () => call('setProvider', { provider: $('provselect').value }))
$('btnSaveProfile').onclick = () => {
  const id = $('profilePick').value
  const tools = [...$('profileTools').querySelectorAll('input[data-pname]')].filter((b) => b.checked).map((b) => b.dataset.pname)
  act('保存工具名单 ' + id, () => call('setProfileTools', { profile: id, tools }))
}
$('btnCreateProfile').onclick = () => {
  const id = $('newProfile').value.trim()
  if (id.length === 0) return toast('先填个档位名', 'bad')
  act('新建档位 ' + id, async () => {
    const r = await call('createProfile', { id })
    $('newProfile').value = ''
    if (r && r.id) $('profilePick').value = r.id
    return r
  })
}
$('btnDeleteProfile').onclick = () => {
  const id = $('profilePick').value
  if (!id || !confirm('删除档位「' + id + '」？引用它的会话会回到「跟随 provider」。')) return
  act('删除档位 ' + id, () => call('deleteProfile', { id }))
}
$('profilePick').onchange = renderProfileEditor
$('plugsearch').oninput = () => { page = 1; renderPlugins() }
$('onlybad').onchange = () => { page = 1; renderPlugins() }
$('pgPrev').onclick = () => { page -= 1; renderPlugins() }
$('pgNext').onclick = () => { page += 1; renderPlugins() }
$('provselect').onchange = () => { $('provhint').textContent = '未保存' }

refresh().catch((e) => toast('读取失败：' + String(e.message || e), 'bad'))
</script>
</body>
</html>
