# dsh-plugin-trim — bundle manifest entry.
#
# 设计：主键是**会话**，provider 只负责默认套档。
#
# config 说明：
#   auto                 true = 切到本地 provider 时顺带物理开关插件（profile 级，影响全部会话）
#   followTools          true = provider 变化时自动给这条会话套默认档
#   localProvider        写死哪个 provider 算本地（面板里选的值存 state 文件，优先）
#   routes               非空时只认这些 provider，关掉自动识别
#   localEntries         插件层要关掉的 entryId 清单
#   defaultProfileFor    本地/云端各自套哪个档
#   profiles             档位定义：full 固定不限；local 是白名单；custom 给面板改
- insert:
    - id: plugin-trim
      name: "dsh-plugin-trim"
      inject: [pluginManager]
      config:
        enabled: true
        auto: false
        followTools: true
        # 固定端口面板（http://127.0.0.1:12256/）；被占则往后顺延
        panelPort: 12256
        routes: []
        localEntries:
          - include:artex-orchestration
          - include:drawai
          - include:dsh-blender-plugin
        defaultProfileFor:
          local: local
          cloud: full
        profiles:
          local:
            - pwsh
            - read
            - write
            - edit
            - glob
            - grep
            - working_directory
            - job_output
            - job_list
            - job_kill
            - todo_write
            - present
            - read_image
            - ask_user_question
          custom: []
